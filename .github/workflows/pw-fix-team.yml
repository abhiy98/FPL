name: Fix Price Watch team loading

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[pw-team-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch team loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old = '''  async function loadMyTeam(){
    var input=document.getElementById('pwTeamId'), id=parseInt(input&&input.value?input.value.trim():'',10); if(!id){showToast('Enter a valid FPL Team ID');return;}
    var button=document.getElementById('pwLoadTeam');button.disabled=true;button.textContent='Loading…';
    try{var entry=await fetchPublicApi('entry/'+id+'/'),ev=currentEvent(state.events),gw=ev?ev.id:1,picksData=await fetchPublicApi('entry/'+id+'/event/'+gw+'/picks/'),picks=new Set((picksData.picks||[]).map(function(x){return x.element;})); state.team={id:id,picks:picks,value:entry.last_deadline_value||entry.value||0,bank:entry.last_deadline_bank||entry.bank||0,name:entry.name||''}; try{localStorage.setItem(STORE_KEY_TEAM,String(id));}catch(e){} showToast('Team loaded');render();}catch(e){showToast('Couldn\\'t load that FPL Team ID');}finally{button.disabled=false;button.textContent='Load my team';}
  }
'''
          new = '''  async function loadMyTeam(){
    var input=document.getElementById('pwTeamId');
    var id=parseInt(input&&input.value?input.value.trim():'',10);
    if(!id){showToast('Enter a valid FPL Team ID');return;}
    var button=document.getElementById('pwLoadTeam');
    button.disabled=true;
    button.textContent='Loading…';
    try{
      var entry=await fetchPublicApi('entry/'+id+'/');
      var gw=entry.current_event || (state.currentGameweek && state.currentGameweek.id) || 1;
      var picksData=null;
      try{
        picksData=await fetchPublicApi('entry/'+id+'/event/'+gw+'/picks/');
      }catch(firstError){
        if(gw>1) picksData=await fetchPublicApi('entry/'+id+'/event/'+(gw-1)+'/picks/');
        else throw firstError;
      }
      var picks=new Set((picksData.picks||[]).map(function(x){return x.element;}));
      if(!picks.size) throw new Error('No picks returned');
      state.team={
        id:id,
        picks:picks,
        value:entry.last_deadline_value||entry.value||0,
        bank:entry.last_deadline_bank||entry.bank||0,
        name:entry.name||''
      };
      try{localStorage.setItem(STORE_KEY_TEAM,String(id));}catch(e){}
      state.myTeamOnly=true;
      var myTeamChip=document.getElementById('myTeamOnly');
      if(myTeamChip) myTeamChip.classList.add('active');
      showToast('My team loaded');
      render();
    }catch(e){
      showToast('Couldn\\'t load that FPL Team ID');
    }finally{
      button.disabled=false;
      button.textContent='Load my team';
    }
  }
'''
          if old not in html:
              raise SystemExit('loadMyTeam block not found')
          html=html.replace(old,new,1)

          old_restore = '''  async function restoreTeam(){try{var id=localStorage.getItem(STORE_KEY_TEAM);if(id){var input=document.getElementById('pwTeamId');if(input)input.value=id;await loadMyTeam();}}catch(e){}}
'''
          new_restore = '''  async function restoreTeam(){
    try{
      var id=localStorage.getItem(STORE_KEY_TEAM);
      if(id){
        var input=document.getElementById('pwTeamId');
        if(input)input.value=id;
        await loadMyTeam();
      }
    }catch(e){}
  }
'''
          if old_restore not in html:
              raise SystemExit('restoreTeam block not found')
          html=html.replace(old_restore,new_restore,1)

          path.write_text(html,encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -q "state.myTeamOnly=true" index.html
          grep -q "entry.current_event" index.html
          rm -f .github/workflows/pw-fix-team.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/pw-fix-team.yml
          git commit -m "fix: make My Team load and filter reliably [pw-team-fix]"
          git push origin HEAD:main
