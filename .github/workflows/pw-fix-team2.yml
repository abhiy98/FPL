name: Apply My Team fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          pattern = r"  async function loadMyTeam\(\)\{.*?\n  \}\n  async function restoreTeam"
          replacement = '''  async function loadMyTeam(){
    var input=document.getElementById('pwTeamId');
    var id=parseInt(input&&input.value?input.value.trim():'',10);
    if(!id){showToast('Enter a valid FPL Team ID');return;}
    var button=document.getElementById('pwLoadTeam');
    button.disabled=true;
    button.textContent='Loading…';
    try{
      var entry=await fetchPublicApi('entry/'+id+'/');
      var gw=entry.current_event || (state.currentGameweek && state.currentGameweek.id) || 1;
      var picksData;
      try{
        picksData=await fetchPublicApi('entry/'+id+'/event/'+gw+'/picks/');
      }catch(firstError){
        if(gw>1) picksData=await fetchPublicApi('entry/'+id+'/event/'+(gw-1)+'/picks/');
        else throw firstError;
      }
      var picks=new Set((picksData.picks||[]).map(function(x){return x.element;}));
      if(!picks.size) throw new Error('No picks returned');
      state.team={id:id,picks:picks,value:entry.last_deadline_value||entry.value||0,bank:entry.last_deadline_bank||entry.bank||0,name:entry.name||''};
      try{localStorage.setItem(STORE_KEY_TEAM,String(id));}catch(e){}
      state.myTeamOnly=true;
      var myTeamChip=document.getElementById('myTeamOnly');
      if(myTeamChip)myTeamChip.classList.add('active');
      showToast('My team loaded');
      render();
    }catch(e){
      showToast('Couldn\\'t load that FPL Team ID');
    }finally{
      button.disabled=false;
      button.textContent='Load my team';
    }
  }
  async function restoreTeam'''

          html, n = re.subn(pattern, replacement, html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('loadMyTeam pattern not found')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q "entry.current_event" index.html
          grep -q "state.myTeamOnly=true" index.html
      - name: Commit fix and clean workflows
        run: |
          rm -f .github/workflows/pw-fix-team.yml .github/workflows/pw-fix-team2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/pw-fix-team.yml .github/workflows/pw-fix-team2.yml
          git commit -m "fix: repair My Team loading and filtering [pw-team-fix]"
          git push origin HEAD:main
